# RequestAuthentication tells Istio's sidecar how to validate JWTs.
# Scope: applied to the gateway so tokens are validated at the edge.
#
# Key facts:
#   - issuer must match the "iss" claim in the token exactly.
#   - jwks is inlined here (HS256 symmetric key); istiod distributes it to
#     every Envoy sidecar — no per-request remote fetch.
#   - A request with NO token is still allowed through here; it is the
#     companion AuthorizationPolicy that rejects unauthenticated requests.
#   - A request with a MALFORMED/expired token → 401 immediately.
#
# The JWKS is generated by scripts/gen-jwt-key.sh and embedded below.
# Re-run that script and re-apply this manifest whenever you rotate the key.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-demo
  # Applied to the gateway so token validation happens at the edge.
  namespace: demo
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: demo-gateway
  jwtRules:
    - issuer: "try-istio@local"
      # Inline JWKS — generated by scripts/gen-jwt-key.sh.
      # Replace the "k" value with the contents of k8s/jwt/jwks.json after
      # running gen-jwt-key.sh.
      jwks: |
        PLACEHOLDER_REPLACE_WITH_JWKS_JSON
      # Forward the validated JWT payload as HTTP headers to the upstream.
      # Header name: "X-Jwt-Payload" (base64url-encoded JSON of the claims).
      # The orders service reads "x-jwt-payload" to populate /whoami.
      forwardOriginalToken: true
