# AuthorizationPolicy that requires a valid JWT on GET /whoami.
#
# Design:
#   - The companion RequestAuthentication already handles signature verification
#     and rejects malformed/expired tokens with 401.
#   - This policy enforces presence of a valid JWT on GET /whoami by explicitly
#     denying requests where requestPrincipal is not from testing@secure.istio.io.
#   - All other routes (e.g. /orders/**) continue to work without a token because
#     this DENY rule is scoped only to /whoami while allow-gateway permits general ingress.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt-for-whoami
  namespace: demo
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: demo-gateway
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["testing@secure.istio.io/*"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/whoami"]
            ports: ["80"]
