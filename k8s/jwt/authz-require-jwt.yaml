# AuthorizationPolicy that requires a valid JWT on GET /whoami.
#
# Design:
#   - The companion RequestAuthentication already handles signature verification
#     and rejects malformed/expired tokens with 401.
#   - This policy enforces *presence* of a valid JWT for /whoami.
#     Requests without a token (no "source.principal") are denied here.
#   - All other routes (e.g. /orders/**) continue to work without a token —
#     keep the existing allow-gateway policy in place.
#
# "requestPrincipals" matches the "iss/sub" string set by Istio after a
# successful JWT validation. The wildcard "*" means any valid token whose
# issuer was declared in RequestAuthentication is accepted.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt-for-whoami
  namespace: demo
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: demo-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/whoami"]
      when:
        - key: request.auth.principal
          # Any iss/sub coming from our RequestAuthentication issuer.
          values: ["testing@secure.istio.io/*"]
